version: v1.3.0

# Demo configuration for running kratos-login-ui locally.
# DO NOT use these secrets in production.

dsn: sqlite:///var/lib/sqlite/db.sqlite?_fk=true

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3001
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://localhost:4434/

selfservice:
  default_browser_return_url: http://localhost:3001/
  allowed_return_urls:
    - http://localhost:3001
    - http://127.0.0.1:3001

  methods:
    password:
      enabled: true
    code:
      enabled: true
      passwordless_enabled: true
    totp:
      enabled: true
      config:
        issuer: kratos-login-ui-demo
    lookup_secret:
      enabled: true
    # Passkeys (discoverable WebAuthn credentials). rp.id must be the
    # top-level domain the UI is served on; origins must list the EXACT
    # scheme+host+port of the page triggering the ceremony. The UI runs on
    # localhost:3001 (Kratos itself is on :4433 but never renders the page).
    passkey:
      enabled: true
      config:
        rp:
          display_name: kratos-login-ui demo
          id: localhost
          origins:
            - http://localhost:3001
    link:
      enabled: true
    profile:
      enabled: true

  flows:
    error:
      ui_url: http://localhost:3001/error

    settings:
      ui_url: http://localhost:3001/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      use: code
      ui_url: http://localhost:3001/recovery

    verification:
      enabled: true
      use: code
      ui_url: http://localhost:3001/verification
      after:
        default_browser_return_url: http://localhost:3001/

    logout:
      after:
        default_browser_return_url: http://localhost:3001/login

    login:
      ui_url: http://localhost:3001/login
      lifespan: 10m

    registration:
      # Self-registration switch — managed at runtime by jinbe
      # (/api/admin/auth/methods → kuma Settings). false = accounts are
      # created only by administrators (kuma Users → create + invite).
      enabled: true
      lifespan: 10m
      ui_url: http://localhost:3001/register
      after:
        password:
          hooks:
            - hook: session

log:
  level: info
  format: text
  leak_sensitive_values: false

secrets:
  cookie:
    - DEMO_DO_NOT_USE_IN_PROD_PLEASE_CHANGE_ME_32+
  cipher:
    - DEMO_DO_NOT_USE_IN_PROD_CHANGEME

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true
